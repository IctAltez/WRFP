<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALTEZ | Route naar de werf</title><meta name="theme-color" content="#1a2b3b"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#1d314b;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}header{background:#fff;border-bottom:1px solid #dce5ef;padding:15px 20px;display:flex;align-items:center;gap:15px}.logo-image{display:block;width:155px;max-height:50px;object-fit:contain}header b{font-size:17px}main{width:min(530px,calc(100vw - 32px));background:#fff;border:1px solid #e0e7f0;border-radius:20px;margin:36px auto;padding:30px 25px;box-shadow:0 14px 30px #153b6a12}.eyebrow{color:#2462b9;text-transform:uppercase;font-weight:800;font-size:12px;letter-spacing:.09em}h1{font-size:28px;line-height:1.2;margin:9px 0 11px}p{color:#5d6f84;margin:0 0 20px}address{font-style:normal;font-weight:650;background:#f1f5fa;border:1px solid #dae4f0;padding:15px;border-radius:12px;margin-bottom:18px;white-space:pre-wrap;overflow-wrap:anywhere}.link{display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:11px;text-decoration:none;padding:16px 17px;margin-top:10px;font-weight:750;color:#fff;background:#175bc3}.link:hover{filter:brightness(.95)}.link.waze{background:#15889a}.link.apple{background:#25364b}.muted{margin-top:24px;text-align:center;color:#7c8b9d;font-size:12px}.err{color:#a13737;font-weight:650}
</style></head><body><header><img class="logo-image" src="altez-logo.png" alt="ALTEZ Construction Group"><b>Route naar de werf</b></header><main><span class="eyebrow">Werfbezoek</span><h1 id="title">Navigeer naar de werf</h1><p>Kies de navigatie-app die je het liefst gebruikt.</p><address id="destination">Bestemming wordt geladen...</address><div id="links"><a class="link" id="google" target="_blank" rel="noopener noreferrer">Google Maps <span>➜</span></a><a class="link waze" id="waze" target="_blank" rel="noopener noreferrer">Waze <span>➜</span></a><a class="link apple" id="apple" target="_blank" rel="noopener noreferrer">Apple Kaarten <span>➜</span></a></div><div class="muted">Controleer de route en de juiste werfingang voordat je vertrekt.</div></main><script>
const p=new URLSearchParams(location.search);
const name=(p.get('name')||'').slice(0,120),address=(p.get('address')||'').slice(0,300);
if(name)document.getElementById('title').textContent=name;
document.getElementById('destination').textContent=address||'Geen werfadres ingevuld';
if(!address){document.getElementById('links').innerHTML='<p class="err">Geen werfadres beschikbaar. Vraag het adres bij de projectleider na.</p>'}else{
 document.getElementById('google').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address);
 document.getElementById('waze').href='https://waze.com/ul?q='+encodeURIComponent(address)+'&navigate=yes';
 document.getElementById('apple').href='https://maps.apple.com/?daddr='+encodeURIComponent(address);
}
</script></body></html>
